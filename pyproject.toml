[project]
name = "am-perceptron-numpy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Icaro Davies", email = "idavies@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
am-perceptron-numpy = "am_perceptron_numpy:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "notebook>=7.6.3",
]

[tool.uv.workspace]
members = [
    "am-naive-bayes-spam",
]
